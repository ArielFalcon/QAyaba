# QAyaba slim — restricted-network deployment. Self-contained: it does NOT extend the root
# docker-compose.yml (nor its dev override).
#
#   ./slim/qayaba.sh build && ./slim/qayaba.sh up        (or: docker compose -f slim/compose.yml …)
#
# One image, two roles. Secrets are split per service at run time: the agents never receive the
# git token or the API token (the agent is read-only on watched repos; only the orchestrator runs git).
# No `dns:` pin: containers resolve through Docker's embedded DNS, i.e. the host/VPN resolver, so
# internal names (GitLab, Artifactory, DEV, the identity provider) resolve.
# Values come from slim/.env (copy slim/.env.example).
#
# Memory budget (see slim/README.md, "Presupuesto de memoria"): a managed laptop usually cannot change
# Docker Desktop's settings, so the Linux VM keeps its default memory, half of the host RAM (8 GiB on
# a 16 GiB laptop). The limits below add up to 6.6 GiB and leave the VM, the Docker engine and the page
# cache the rest. Chromium needs no `shm_size`: Playwright launches it with --disable-dev-shm-usage,
# so the default 64 MB /dev/shm is enough for the specs, the DOM capture and the Playwright MCP.

name: qayaba-slim

x-build: &build
  context: ..
  dockerfile: slim/Dockerfile
  args:
    PW_IMAGE: ${PW_IMAGE:-mcr.microsoft.com/playwright:v1.60.0-noble}
    NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm}
    GO_IMAGE: ${GO_IMAGE:-golang:1.26-bookworm}
    NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    GOSUMDB: ${GOSUMDB:-sum.golang.org}
    APT_MIRROR: ${APT_MIRROR:-}
    APT_PORTS_MIRROR: ${APT_PORTS_MIRROR:-}
    GITHUB_RELEASES_BASE: ${GITHUB_RELEASES_BASE:-https://github.com}
    JDTLS_BASE_URL: ${JDTLS_BASE_URL:-https://download.eclipse.org/jdtls/milestones/1.58.0}
    MAVEN_REPO: ${MAVEN_REPO:-https://repo.maven.apache.org/maven2}
    JDTLS_XMX: ${JDTLS_XMX:-1024m}

x-image: &image qayaba-slim:${QAYABA_SLIM_TAG:-local}

services:
  orchestrator:
    image: *image
    build: *build
    command: ["npm", "run", "start"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    depends_on:
      agents:
        condition: service_healthy
    ports:
      # Loopback only: the console, API and webhook are never exposed on the corporate network.
      - "127.0.0.1:${QAYABA_PORT:-8080}:8080"
    environment:
      QAYABA_PROFILE: slim
      PORT: "8080"
      # A bare `npm run start` listens on loopback only; in the container it must listen on every
      # interface. The published port above is what stays loopback-only on the host.
      LISTEN_HOST: 0.0.0.0
      OPENCODE_SERVE_URL: http://agents:4096
      AGENT_SUPERVISOR_URL: http://agents:4097
      AGENT_RUNTIME_MODE: single
      AGENT_SINGLE_PROVIDER: opencode
      # Optional: the stack boots without it and takes the key at run time (web console or TUI).
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_TIMEOUT_MS: ${OPENCODE_TIMEOUT_MS:-900000}
      MIRROR_DIR: /app/.mirrors
      CBM_CACHE_DIR: /app/.codebase-memory
      CODE_SANDBOX_UID: "1002"
      QAYABA_EXPORT_DIR: /app/exports
      GIT_REMOTE_BASE: ${GIT_REMOTE_BASE:?set GIT_REMOTE_BASE in slim/.env}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_TOKEN_USER: ${GIT_TOKEN_USER:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-qayaba-qa}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-qayaba-qa@localhost}
      QA_API_TOKEN: ${QA_API_TOKEN:-}
      # No automatic console login (QA_WEB_AUTO_LOGIN): it would hand an operator session to any
      # peer on the compose network that sends `Host: localhost`, the agents container included.
      # The console signs in with the local API token (`./slim/qayaba.sh console`).
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      DEV_ENV_USER: ${DEV_ENV_USER:-}
      DEV_ENV_PASS: ${DEV_ENV_PASS:-}
      DEV_TEST_USER: ${DEV_TEST_USER:-}
      DEV_TEST_PASS: ${DEV_TEST_PASS:-}
      NO_PROXY: agents,orchestrator,localhost,127.0.0.1,${EXTRA_NO_PROXY:-}
      no_proxy: agents,orchestrator,localhost,127.0.0.1,${EXTRA_NO_PROXY:-}
    volumes:
      - ../config:/app/config # app YAMLs + e2e seed; the API token is generated here (config/.api_token)
      - ./exports:/app/exports # local publication: patch + MR/Issue bodies per run, visible on the host
      - mirrors:/app/.mirrors
      - qa-data:/app/data
      - codebase-memory:/app/.codebase-memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${ORCHESTRATOR_MEMORY:-2560m}
          cpus: "2.0"

  # One-shot, before the agents: freezes the effective OpenCode config. OpenCode reads its global config
  # at every start (every key paste restarts it) and the agents' shell runs as root, so the config must
  # not live in a directory the agents can write. This service copies the image's config into named
  # volumes that the agents mount read-only; root without CAP_SYS_ADMIN cannot remount them read-write.
  # The home `.opencode` directory is read by OpenCode as a config directory as well, and on Linux it
  # loads a managed config from /etc/opencode after every other source (it beats the global one): both
  # are kept empty and read-only. `up` runs this again, so each start begins from the image's config.
  config-init:
    image: *image
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -eu
        for name in opencode agent; do
          find "/frozen/$$name" -mindepth 1 -delete
          cp -a "/root/.config/$$name/." "/frozen/$$name/"
        done
        find /frozen/opencode-home -mindepth 1 -delete
        find /frozen/opencode-managed -mindepth 1 -delete
        test -f /frozen/opencode/opencode.json
    environment:
      NO_PROXY: agents,orchestrator,localhost,127.0.0.1,${EXTRA_NO_PROXY:-}
      no_proxy: agents,orchestrator,localhost,127.0.0.1,${EXTRA_NO_PROXY:-}
    volumes:
      - opencode-config:/frozen/opencode
      - agent-prompts:/frozen/agent
      - opencode-home:/frozen/opencode-home
      - opencode-managed:/frozen/opencode-managed
    deploy:
      resources:
        limits:
          memory: 64m

  agents:
    image: *image
    build: *build
    # An operator-provided Maven settings.xml (Artifactory mirror) is mounted read-only at
    # /root/.m2-settings and linked to Maven's default location, which JDTLS and `mvn` both read, so the
    # agents' shell can read it but never rewrite the host file. `exec` keeps the supervisor as PID 1.
    command:
      - sh
      - -c
      - 'if [ -f /root/.m2-settings/settings.xml ]; then mkdir -p "$$HOME/.m2" && ln -sf /root/.m2-settings/settings.xml "$$HOME/.m2/settings.xml"; fi; exec node /usr/local/bin/agent-supervisor.mjs'
    restart: unless-stopped
    depends_on:
      config-init:
        condition: service_completed_successfully
    environment:
      MIRROR_DIR: /app/.mirrors
      ENGRAM_DATA_DIR: /data
      AGENT_PROMPT_DIR: /root/.config/agent
      AGENT_SUPERVISOR_PORT: "4097"
      AGENT_RUNTIME_MODE: single
      AGENT_SINGLE_PROVIDER: opencode
      # Optional: the stack boots without it and takes the key at run time (web console or TUI).
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_PRINT_LOGS: "true"
      OPENCODE_LOG_LEVEL: ${OPENCODE_LOG_LEVEL:-INFO}
      # The Playwright MCP explores DEV through the same central login the specs use.
      DEV_ENV_USER: ${DEV_ENV_USER:-}
      DEV_ENV_PASS: ${DEV_ENV_PASS:-}
      DEV_TEST_USER: ${DEV_TEST_USER:-}
      DEV_TEST_PASS: ${DEV_TEST_PASS:-}
      NO_PROXY: agents,orchestrator,localhost,127.0.0.1,${EXTRA_NO_PROXY:-}
      no_proxy: agents,orchestrator,localhost,127.0.0.1,${EXTRA_NO_PROXY:-}
    volumes:
      - mirrors:/app/.mirrors # same path as the orchestrator: the agent's session cwd
      - engram-data:/data
      - opencode-data:/root/.local/share/opencode
      # The effective OpenCode config, the provider-neutral prompts and the (empty) home and managed
      # config directories, read-only: only config-init writes them. The agents' shell cannot change the
      # config OpenCode reads at its next start.
      - opencode-config:/root/.config/opencode:ro
      - agent-prompts:/root/.config/agent:ro
      - opencode-home:/root/.opencode:ro
      - opencode-managed:/etc/opencode:ro
      # Optional: Artifactory Maven mirror for the Java language server's dependency resolution.
      # Read-only: the file may hold credentials and the agents' shell must not rewrite it.
      - ./maven:/root/.m2-settings:ro
      # Maven's local repository, written at run time, stays out of the host directory.
      - maven-repository:/root/.m2/repository
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4097/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${AGENTS_MEMORY:-4g}
          cpus: "3.0"

  # Terminal console: `./slim/qayaba.sh tui` (docker compose run --rm tui).
  tui:
    image: *image
    profiles: ["tui"]
    command: ["qayaba"]
    stdin_open: true
    tty: true
    depends_on:
      - orchestrator
    environment:
      QA_HOST: orchestrator:8080
      QAYABA_ROOT: /app
      TERM: ${TERM:-xterm-256color}
      # The console reaches the orchestrator by service name: it must never go through a proxy.
      NO_PROXY: agents,orchestrator,localhost,127.0.0.1,${EXTRA_NO_PROXY:-}
      no_proxy: agents,orchestrator,localhost,127.0.0.1,${EXTRA_NO_PROXY:-}
    volumes:
      - ../config:/app/config:ro
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  mirrors:
  qa-data:
  codebase-memory:
  engram-data:
  opencode-data:
  opencode-config:
  agent-prompts:
  opencode-home:
  opencode-managed:
  maven-repository:
