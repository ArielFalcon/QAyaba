# OPT-IN local telemetry stack: two OpenTelemetry collectors (one per trust level), Grafana/Tempo/Prometheus
# (grafana/otel-lgtm) and a loopback proxy in front of Grafana. Plain `docker compose up` does not include this file and
# behaves exactly as before. Start it with:
#
#   GRAFANA_ADMIN_PASSWORD=... docker compose \
#     -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.telemetry.yml \
#     --profile telemetry up --build
#
# FOOTGUN: this file is only ever used WITH `--profile telemetry`, and it needs GRAFANA_ADMIN_PASSWORD for EVERY compose
# command that loads it (up, down, ps, logs, config), because compose interpolates the whole file. Without the profile
# the orchestrator is still pointed at a collector that is never started. See docs/telemetry-local.md.
#
# Trust model (docs/observability-design.md §9.2). Network isolation is per container, so each receiver is its own
# service and no container holds a receiver on a network its clients should not reach:
#   collector         telemetry-internal ONLY. The trusted receiver (:4318) the orchestrator writes to.
#   collector-agents  agent-otlp + telemetry-internal (the latter only to export to lgtm). The untrusted receiver (:4319);
#                     its pipeline strips orchestrator-owned and content keys from spans and logs and stamps
#                     qayaba.trust=agent. OpenCode's logs are kept; its process-wide, rootless traces are dropped.
# The agents container is on agent-otlp, never on telemetry-internal, so it can reach only collector-agents.
# lgtm is on telemetry-internal ONLY (no route out). grafana-proxy is the one process on telemetry-ui, the network that
# carries the loopback-published port. The sandbox uid runs inside the orchestrator's network namespace behind its own
# iptables chain (bin/egress-init.sh), which this file does not touch.

x-collector: &collector
  image: otel/opentelemetry-collector-contrib:0.163.1
  profiles: [telemetry]
  restart: unless-stopped
  # Non-root. The rotating debug file lives in a named volume that otel-debug-init hands to this uid.
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    otel-debug-init:
      condition: service_completed_successfully
    lgtm:
      condition: service_started
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"

services:
  otel-debug-init:
    image: busybox:1.37.0
    profiles: [telemetry]
    restart: "no"
    # One-shot: the only root process of the stack. It chowns the debug volume for the collectors' uid and exits.
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/var/lib/otel-debug"]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - otel-debug:/var/lib/otel-debug

  collector:
    <<: *collector
    command: ["--config=/etc/otelcol/collector.yaml"]
    # No host ports on purpose, and no agent-facing network: only the orchestrator can reach this receiver.
    networks:
      - telemetry-internal
    volumes:
      - ./config/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - otel-debug:/var/lib/otel-debug
    deploy:
      resources:
        limits:
          memory: 768M

  collector-agents:
    <<: *collector
    command: ["--config=/etc/otelcol/collector-agents.yaml"]
    # No host ports. agent-otlp is where the agents container reaches it; telemetry-internal is only for exporting to lgtm.
    networks:
      - agent-otlp
      - telemetry-internal
    volumes:
      - ./config/otel/collector-agents.yaml:/etc/otelcol/collector-agents.yaml:ro
      - otel-debug:/var/lib/otel-debug
    deploy:
      resources:
        limits:
          memory: 384M

  lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [telemetry]
    restart: unless-stopped
    # Internal network only: Tempo, Prometheus and Grafana have no route out and no published port.
    networks:
      - telemetry-internal
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      # Required, never defaulted: compose refuses to start without it. Set it in Doppler or .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD to start the telemetry stack}
      # R4: spans are kept 30 days. The image's Tempo config has no retention key (its default is 14 days); its start
      # script appends this variable to the Tempo command line (Tempo 3.x flag).
      TEMPO_EXTRA_ARGS: "-backend-worker.compaction.block-retention=720h"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - lgtm-data:/data
      # The image's Loki config has no retention key; Loki's retention is YAML-only, so this copy adds it. Read-only: the
      # image starts Loki with -config.file=./loki-config.yaml and never writes it.
      - ./config/otel/loki-config.yaml:/otel-lgtm/loki-config.yaml:ro
      # Provisioned by the LGTM image itself from /otel-lgtm/grafana/conf/provisioning (verified on the pinned image).
      - ./config/grafana/qayaba-evaluations.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/qayaba-evaluations.yaml:ro
      - ./config/grafana/dashboards:/otel-lgtm/qayaba-dashboards:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G

  grafana-proxy:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    profiles: [telemetry]
    restart: unless-stopped
    depends_on:
      lgtm:
        condition: service_started
    # telemetry-internal reaches lgtm; telemetry-ui (not internal) carries the loopback-published port, because a
    # container attached only to an internal network cannot publish one. This process is the only member of telemetry-ui.
    networks:
      - telemetry-internal
      - telemetry-ui
    ports:
      # Grafana only, loopback only. Tempo, Prometheus and the OTLP ports are never published.
      - "127.0.0.1:3001:8080"
    volumes:
      - ./config/otel/grafana-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  orchestrator:
    # An explicit networks list drops `default` unless it is named, and the orchestrator needs it (agents, DEV, GitHub).
    networks:
      - default
      - telemetry-internal
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_SERVICE_NAME: qayaba-orchestrator

  agents:
    # The agents container is deliberately NOT on telemetry-internal: it can reach only collector-agents, over agent-otlp.
    # QA_AGENT_OTLP_ENDPOINT makes the supervisor give Codex a trace exporter pointed at that receiver (traces only; the
    # supervisor writes the [otel] table of Codex's config.toml). OTEL_EXPORTER_OTLP_ENDPOINT is OpenCode's own switch: it
    # exports logs and traces to the same receiver, where the trace pipeline drops its spans and the log pipeline keeps
    # its logs. Codex never receives this variable (its exec env is an exact-name allowlist), and OpenCode's
    # experimental.openTelemetry (content-bearing ai.* spans) stays off.
    environment:
      QA_AGENT_OTLP_ENDPOINT: http://collector-agents:4319
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector-agents:4319
    networks:
      - default
      - agent-otlp

networks:
  telemetry-internal:
    internal: true
  agent-otlp:
    internal: true
  telemetry-ui:

volumes:
  lgtm-data:
  otel-debug:
