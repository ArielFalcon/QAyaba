# Two long-lived services:
#   orchestrator → the Node infrastructure (webhook, gate, working copy, execution, reporting)
#   agents       → dual agent container: supervisor + OpenCode/Codex runtimes + MCPs
#
# They share the `mirrors` volume: the orchestrator clones/checks out the repo
# working copy and the agent reads/writes there (the session cwd). Since
# both services are persistent, the working copies persist.
#
# Doppler injects the secrets (`doppler run -- docker compose up`); the env_file
# .env is only for running locally without Doppler.
#
# This base file is the PRODUCTION definition: the orchestrator runs the src/ baked into the
# image (COPY in the Dockerfile), so the maintainer hot-swap (which rewrites src/ + package
# files) works on a normal filesystem. docker-compose.override.yml — auto-loaded by plain
# `docker compose up` for local dev — bind-mounts the host source READ-ONLY for live editing; the
# swap canNOT rewrite a read-only src/ or package file (EROFS), so hot-swap is intentionally a no-op in dev. For production run WITHOUT the override:
#   docker compose -f docker-compose.yml up --build
#
# The local telemetry stack starts with the app, from this file: two OpenTelemetry collectors (one per trust level),
# grafana/otel-lgtm (Grafana, Loki, Tempo, Prometheus) and a loopback proxy in front of Grafana (127.0.0.1:3001). It needs
# GRAFANA_ADMIN_PASSWORD (Doppler or .env) for every compose command. See docs/telemetry-local.md.
#
# Telemetry trust model (docs/observability-design.md §9.2). Network isolation is per container, so each receiver is its
# own service and no container holds a receiver on a network its clients should not reach:
#   collector         telemetry-internal ONLY. The trusted receiver (:4318) the orchestrator writes to.
#   collector-agents  agent-otlp + telemetry-internal (the latter only to export to lgtm). The untrusted receiver (:4319);
#                     its pipeline strips orchestrator-owned and content keys from spans and logs and stamps
#                     qayaba.trust=agent. OpenCode's logs are kept; its process-wide, rootless traces are dropped.
# The agents container is on agent-otlp, never on telemetry-internal, so it can reach only collector-agents.
# lgtm is on telemetry-internal ONLY (no route out). grafana-proxy is the one process on telemetry-ui, the network that
# carries the loopback-published port. The sandbox uid runs inside the orchestrator's network namespace behind its own
# iptables chain (bin/egress-init.sh), which the telemetry services do not touch.

x-collector: &collector
  image: otel/opentelemetry-collector-contrib:0.163.1
  restart: unless-stopped
  # Non-root. The rotating debug file lives in a named volume that otel-debug-init hands to this uid.
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    otel-debug-init:
      condition: service_completed_successfully
    lgtm:
      condition: service_started
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"

services:
  orchestrator:
    build: .
    # An init as PID 1: the run's Playwright browsers (spawned as the sandbox uid) and tsx's esbuild are children whose parent can
    # exit first, and an orphan is reparented to PID 1. The service's own main process does not reap what it did not start, so
    # without an init those orphans stay defunct for the life of the container (the host-health gauge counts them).
    init: true
    env_file: .env
    restart: always
    # Defense-in-depth for the untrusted code the orchestrator executes (agent-authored specs, the e2e
    # project's own tooling and installs, a login script, and — for code-mode — the watched repo's own
    # install/test command). Every such child starts through one launcher, which DROPS PRIVILEGE to the
    # unprivileged `sandbox` user (uid 1002) with an environment built from an allowlist per profile,
    # so it cannot read the root-owned API token, the auth material, another repo's mirror or the
    # provider keys, tamper with the orchestrator's files, or write the mirror it runs in — see
    # docs/execution-sandbox.md. The entrypoint proves the file side at every boot by trying, as that uid, what it must not do
    # (src/server/file-boundary-check.ts); a boundary that does not hold refuses agent code (E-SANDBOX). no-new-privileges blocks the dropped child from re-acquiring root via
    # setuid. NET_ADMIN is for the egress filter (bin/egress-init.sh): an iptables chain that holds the
    # sandbox uid's network to the origins the app declares.
    security_opt:
      - no-new-privileges:true
    # The egress filter (bin/egress-init.sh) is an iptables chain on this container's own network namespace. NET_ADMIN is
    # the capability to write it; the sandbox uid, which runs the untrusted code, does not have it (a dropped uid keeps
    # no capabilities) and cannot undo the chain.
    cap_add:
      - NET_ADMIN
    # The graceful-shutdown drain (src/index.ts) needs up to 25s to close the in-flight run;
    # Docker's default 10s grace would SIGKILL it mid-drain on every `docker stop`/redeploy.
    stop_grace_period: 35s
    # Explicit public resolvers: Docker's embedded DNS (127.0.0.11) forwards to the host
    # resolver, which under a VPN / split-DNS may fail to resolve external names (this caused
    # "ENOTFOUND github.com" when opening the PR). Pinning resolvers makes egress deterministic.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      agents:
        condition: service_healthy
    # An explicit networks list drops `default` unless it is named, and the orchestrator needs it (agents, DEV, GitHub).
    networks:
      - default
      - telemetry-internal
    ports:
      # Host and container share PORT. The process listens on PORT (env_file + the
      # environment entry below); a fixed :8080 on the right would publish a port
      # nothing inside the container is bound to. BIND_ADDR defaults the published port to
      # loopback-only (127.0.0.1) — set it to 0.0.0.0 only behind your own reverse proxy/auth,
      # never to expose the control plane directly (see README.md).
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-458}:${PORT:-458}"
    environment:
      # Wins over env_file so the listen port cannot drift from the published port.
      PORT: ${PORT:-458}
      # A bare `npm run start` listens on loopback only. Inside the container the process must
      # listen on every interface for the published port (and the other services) to reach it;
      # BIND_ADDR above decides whether that port is exposed beyond the host.
      LISTEN_HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_SERVICE_NAME: qayaba-orchestrator
      # Telemetry health verifies the stores end to end over telemetry-internal (src/telemetry/backend-health.ts).
      QA_TELEMETRY_LOKI_URL: http://lgtm:3100
      QA_TELEMETRY_TEMPO_URL: http://lgtm:3200
      QA_TELEMETRY_COLLECTOR_METRICS_URLS: http://collector:8888/metrics
      OPENCODE_SERVE_URL: http://agents:4096
      # Basic-auth password of `opencode serve` on the agents service: the SAME value on both services (the
      # supervisor generates a random one when it is unset, and the orchestrator then fails loudly on every call).
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      AGENT_SUPERVISOR_URL: http://agents:4097
      MIRROR_DIR: /app/.mirrors
      # noble drift: the image's `sandbox` user is uid 1002 (pwuser took 1001 on Ubuntu 24.04) — keep
      # code-runner.ts (CODE_SANDBOX_UID ?? 1001) in sync with the Dockerfile so privilege-drop resolves.
      CODE_SANDBOX_UID: "1002"
      # `required`: a run that cannot drop to the sandbox uid refuses to execute agent code and ends E-SANDBOX.
      # `best-effort` (the engine's default outside this file) runs as the current user with a loud warning, for a
      # host without the uid.
      QA_EXEC_SANDBOX: ${QA_EXEC_SANDBOX:-required}
      # `enforce` (default): a run that would execute agent code without the egress filter ends E-SANDBOX. `warn`: it runs
      # with the container's full network and says so (gate signal sandbox.egress "unenforced"). Declare the origins a
      # run may reach with dev.allowedOrigins in the app config and egress.installOrigins for registries.
      QA_EGRESS_MODE: ${QA_EGRESS_MODE:-enforce}
      # The agents' tools' internal endpoint (run_spec and the authenticated browser; a second listener, NOT published above) and the
      # service token the agents service authenticates to it with: the SAME value on both services. Unset on the orchestrator, no run is
      # granted either tool; unset on the agents service only, their calls are refused with a message naming the variable. A run gets
      # run_spec only when its app sets qa.closedLoop.enabled, and the browser only when it sets qa.agentBrowser.enabled.
      QA_TOOLS_PORT: ${QA_TOOLS_PORT:-459}
      QA_TOOLS_TOKEN: ${QA_TOOLS_TOKEN:-}
    volumes:
      # App configs + the config/e2e seed (read-mostly; not hot-swapped). Mounted under /app/.host, a directory only root may
      # enter (/app/config is a link to it, see the Dockerfile): the host folder's own permissions may not be enforced (Docker
      # Desktop's file sharing), the parent's always are, so the sandbox uid cannot reach the configs on any host.
      - ./config:/app/.host/config
      # NOTE: src/ and package files are NOT bind-mounted here on purpose — the hot-swap must be
      # able to rewrite them (a read-only bind mount → EROFS). They ship baked in the image. The dev
      # override re-adds them, read-only, for live editing. The E2E suite is NOT in a volume: it lives in git.
      - mirrors:/app/.mirrors # local working copies (shared with the agents container); the harness runs over <repo>/e2e here
      - qa-data:/app/data # run history + maintainer state (markers/ledger/failure memory) — persists across restarts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-458}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  agents:
    build: ./agents # dual agent runtime: OpenCode + Codex + uv/JDK (Serena)
    restart: always
    # Same init: the browser of the Playwright MCP and the runtimes' own tool children can outlive the process that started them.
    init: true
    # Same explicit resolvers as the orchestrator: the agent must reach the model gateway and
    # the live DEV site (Playwright MCP) regardless of host/VPN DNS quirks.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # SECURITY: the agent container does NOT get the full .env. It receives ONLY the
    # model-provider keys, the shared OpenCode server password, the run_spec service token and DEV_ENV_* (the HTTP Basic gate
    # of DEV, read by the baseline arm's Playwright config and a Codex shell) — NEVER the test
    # account (DEV_TEST_*: the app login is the orchestrator's and the agent only gets the saved
    # session) nor GITHUB_TOKEN / WEBHOOK_SECRET / QA_API_TOKEN. Git writes are the orchestrator's
    # job, so the agent has no push credential to exfiltrate. (docker compose reads
    # ./.env for ${VAR} interpolation, so this works locally and under Doppler.)
    # The agents container is deliberately NOT on telemetry-internal: it can reach only collector-agents, over agent-otlp.
    networks:
      - default
      - agent-otlp
    environment:
      # QA_AGENT_OTLP_ENDPOINT makes the supervisor give Codex a trace exporter pointed at collector-agents (traces only; the
      # supervisor writes the [otel] table of Codex's config.toml). OTEL_EXPORTER_OTLP_ENDPOINT is OpenCode's own switch: it
      # exports logs and traces to the same receiver, where the trace pipeline drops its spans and the log pipeline keeps
      # its logs. Codex never receives this variable (its exec env is an exact-name allowlist), and OpenCode's
      # experimental.openTelemetry (content-bearing ai.* spans) stays off.
      QA_AGENT_OTLP_ENDPOINT: http://collector-agents:4319
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector-agents:4319
      MIRROR_DIR: /app/.mirrors
      AGENT_PROMPT_DIR: /root/.config/agent
      AGENT_SUPERVISOR_PORT: 4097
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-single}
      AGENT_SINGLE_PROVIDER: ${AGENT_SINGLE_PROVIDER:-}
      AGENT_PRIMARY_PROVIDER: ${AGENT_PRIMARY_PROVIDER:-}
      AGENT_REVIEWER_PROVIDER: ${AGENT_REVIEWER_PROVIDER:-}
      AGENT_CHAT_PROVIDER: ${AGENT_CHAT_PROVIDER:-}
      AGENT_PRIMARY_MODEL: ${AGENT_PRIMARY_MODEL:-}
      AGENT_REVIEWER_MODEL: ${AGENT_REVIEWER_MODEL:-}
      AGENT_CHAT_MODEL: ${AGENT_CHAT_MODEL:-}
      OPENCODE_PRINT_LOGS: "true"
      OPENCODE_LOG_LEVEL: ${OPENCODE_LOG_LEVEL:-INFO}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      # Direct DeepSeek provider (agents/opencode.json `provider.deepseek-api`).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Required by `opencode serve` (port 4096 is open to every container on the network); see the orchestrator entry.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      # run_spec and authbrowser_* tools (agents/tool/): where the orchestrator's internal endpoint is, and the service token it requires.
      QA_TOOLS_PORT: ${QA_TOOLS_PORT:-459}
      QA_TOOLS_TOKEN: ${QA_TOOLS_TOKEN:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      DEV_ENV_USER: ${DEV_ENV_USER:-}
      DEV_ENV_PASS: ${DEV_ENV_PASS:-}
      # `opencode serve` ignores a watched repo's own opencode.json/.opencode (they could re-grant a shell or run a
      # plugin). Only the baseline experiment needs them: set exactly "true" for that run, never in production.
      AGENT_ALLOW_PROJECT_CONFIG: ${AGENT_ALLOW_PROJECT_CONFIG:-}
    volumes:
      - ./agents:/root/.config/opencode:ro # opencode.json + agents + AGENTS.md + skills (read-only: agents must NOT rewrite their own prompts)
      - ./agent:/root/.config/agent:ro # provider-neutral prompts/skills for Codex and future OpenCode config
      - mirrors:/app/.mirrors # SAME path as the orchestrator: the agent reads/writes here (Serena caches in <repo>/.serena)
      - serena-cache:/root/.cache/uv # uv/Serena cache (avoids re-downloading on each boot)
      - opencode-data:/root/.local/share/opencode # sessions + auth — survives restarts
      - codex-data:/root/.codex # Codex auth/session state — survives restarts
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4097/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "4.0"

  otel-debug-init:
    image: busybox:1.37.0
    restart: "no"
    # One-shot: the only root process of the stack. It chowns the debug volume for the collectors' uid and exits.
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/var/lib/otel-debug"]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - otel-debug:/var/lib/otel-debug

  collector:
    <<: *collector
    command: ["--config=/etc/otelcol/collector.yaml"]
    # No host ports on purpose, and no agent-facing network: only the orchestrator can reach this receiver.
    networks:
      - telemetry-internal
    volumes:
      - ./config/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - otel-debug:/var/lib/otel-debug
    deploy:
      resources:
        limits:
          memory: 768M

  collector-agents:
    <<: *collector
    command: ["--config=/etc/otelcol/collector-agents.yaml"]
    # No host ports. agent-otlp is where the agents container reaches it; telemetry-internal is only for exporting to lgtm.
    networks:
      - agent-otlp
      - telemetry-internal
    volumes:
      - ./config/otel/collector-agents.yaml:/etc/otelcol/collector-agents.yaml:ro
      - otel-debug:/var/lib/otel-debug
    deploy:
      resources:
        limits:
          memory: 384M

  lgtm:
    image: grafana/otel-lgtm:0.37.0
    restart: unless-stopped
    # Internal network only: Tempo, Prometheus and Grafana have no route out and no published port.
    networks:
      - telemetry-internal
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      # Required, never defaulted: compose refuses to start without it. Set it in Doppler or .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD to start the telemetry stack}
      # R4: spans are kept 30 days. The image's Tempo config has no retention key (its default is 14 days); its start
      # script appends this variable to the Tempo command line (Tempo 3.x flag).
      TEMPO_EXTRA_ARGS: "-backend-worker.compaction.block-retention=720h"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - lgtm-data:/data
      # The image's Loki config has no retention key; Loki's retention is YAML-only, so this copy adds it. Read-only: the
      # image starts Loki with -config.file=./loki-config.yaml and never writes it.
      - ./config/otel/loki-config.yaml:/otel-lgtm/loki-config.yaml:ro
      # Provisioned by the LGTM image itself from /otel-lgtm/grafana/conf/provisioning (verified on the pinned image).
      - ./config/grafana/qayaba-evaluations.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/qayaba-evaluations.yaml:ro
      - ./config/grafana/dashboards:/otel-lgtm/qayaba-dashboards:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G

  grafana-proxy:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      lgtm:
        condition: service_started
    # telemetry-internal reaches lgtm; telemetry-ui (not internal) carries the loopback-published port, because a
    # container attached only to an internal network cannot publish one. This process is the only member of telemetry-ui.
    networks:
      - telemetry-internal
      - telemetry-ui
    ports:
      # Grafana only, loopback only. Tempo, Prometheus and the OTLP ports are never published.
      - "127.0.0.1:3001:8080"
    volumes:
      - ./config/otel/grafana-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  telemetry-internal:
    internal: true
  agent-otlp:
    internal: true
  telemetry-ui:

volumes:
  mirrors:
  qa-data:
  serena-cache:
  opencode-data:
  codex-data:
  lgtm-data:
  otel-debug:
