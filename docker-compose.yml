# Two long-lived services:
#   orchestrator → the Node infrastructure (webhook, gate, working copy, execution, reporting)
#   agents       → dual agent container: supervisor + OpenCode/Codex runtimes + MCPs
#
# They share the `mirrors` volume: the orchestrator clones/checks out the repo
# working copy and the agent reads/writes there (the session cwd). Since
# both services are persistent, memory (engram) and the working copies persist.
#
# Doppler injects the secrets (`doppler run -- docker compose up`); the env_file
# .env is only for running locally without Doppler.
#
# This base file is the PRODUCTION definition: the orchestrator runs the src/ baked into the
# image (COPY in the Dockerfile), so the maintainer hot-swap (which rewrites src/ + package
# files) works on a normal filesystem. docker-compose.override.yml — auto-loaded by plain
# `docker compose up` for local dev — bind-mounts the host source for live editing; those bind
# mounts make src/ a mountpoint and the package files bind-files, which the swap canNOT rewrite
# (EBUSY), so hot-swap is intentionally a no-op in dev. For production run WITHOUT the override:
#   docker compose -f docker-compose.yml up --build

services:
  orchestrator:
    build: .
    env_file: .env
    restart: always
    # Defense-in-depth for the untrusted code the orchestrator executes (agent-authored specs, the e2e
    # project's own tooling and installs, a login script, and — for code-mode — the watched repo's own
    # install/test command). Every such child starts through one launcher, which DROPS PRIVILEGE to the
    # unprivileged `sandbox` user (uid 1002) with an environment built from an allowlist per profile,
    # so it cannot read the root-owned API token, the auth material, another repo's mirror or the
    # provider keys, tamper with the orchestrator's files, or write the mirror it runs in — see
    # docs/execution-sandbox.md. no-new-privileges blocks the dropped child from re-acquiring root via
    # setuid. NET_ADMIN is for the egress filter (bin/egress-init.sh): an iptables chain that holds the
    # sandbox uid's network to the origins the app declares.
    security_opt:
      - no-new-privileges:true
    # The egress filter (bin/egress-init.sh) is an iptables chain on this container's own network namespace. NET_ADMIN is
    # the capability to write it; the sandbox uid, which runs the untrusted code, does not have it (a dropped uid keeps
    # no capabilities) and cannot undo the chain.
    cap_add:
      - NET_ADMIN
    # The graceful-shutdown drain (src/index.ts) needs up to 25s to close the in-flight run;
    # Docker's default 10s grace would SIGKILL it mid-drain on every `docker stop`/redeploy.
    stop_grace_period: 35s
    # Explicit public resolvers: Docker's embedded DNS (127.0.0.11) forwards to the host
    # resolver, which under a VPN / split-DNS may fail to resolve external names (this caused
    # "ENOTFOUND github.com" when opening the PR). Pinning resolvers makes egress deterministic.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      agents:
        condition: service_healthy
    ports:
      # Host and container share PORT. The process listens on PORT (env_file + the
      # environment entry below); a fixed :8080 on the right would publish a port
      # nothing inside the container is bound to. BIND_ADDR defaults the published port to
      # loopback-only (127.0.0.1) — set it to 0.0.0.0 only behind your own reverse proxy/auth,
      # never to expose the control plane directly (see README.md).
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-458}:${PORT:-458}"
    environment:
      # Wins over env_file so the listen port cannot drift from the published port.
      PORT: ${PORT:-458}
      # A bare `npm run start` listens on loopback only. Inside the container the process must
      # listen on every interface for the published port (and the other services) to reach it;
      # BIND_ADDR above decides whether that port is exposed beyond the host.
      LISTEN_HOST: 0.0.0.0
      OPENCODE_SERVE_URL: http://agents:4096
      # Basic-auth password of `opencode serve` on the agents service: the SAME value on both services (the
      # supervisor generates a random one when it is unset, and the orchestrator then fails loudly on every call).
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      AGENT_SUPERVISOR_URL: http://agents:4097
      MIRROR_DIR: /app/.mirrors
      # codebase-memory's graph store (one SQLite db per indexed project). Explicit so the volume
      # mount below and the CLI agree on the path — the CLI's default (~/.cache/codebase-memory-mcp)
      # would land inside the container FS and be wiped on every rebuild.
      CBM_CACHE_DIR: /app/.codebase-memory
      # noble drift: the image's `sandbox` user is uid 1002 (pwuser took 1001 on Ubuntu 24.04) — keep
      # code-runner.ts (CODE_SANDBOX_UID ?? 1001) in sync with the Dockerfile so privilege-drop resolves.
      CODE_SANDBOX_UID: "1002"
      # `required`: a run that cannot drop to the sandbox uid refuses to execute agent code and ends E-SANDBOX.
      # `best-effort` (the engine's default outside this file) runs as the current user with a loud warning, for a
      # host without the uid.
      QA_EXEC_SANDBOX: ${QA_EXEC_SANDBOX:-required}
      # `enforce` (default): a run that would execute agent code without the egress filter ends E-SANDBOX. `warn`: it runs
      # with the container's full network and says so (gate signal sandbox.egress "unenforced"). Declare the origins a
      # run may reach with dev.allowedOrigins in the app config and egress.installOrigins for registries.
      QA_EGRESS_MODE: ${QA_EGRESS_MODE:-enforce}
      # The agents' tools' internal endpoint (run_spec and the authenticated browser; a second listener, NOT published above) and the
      # service token the agents service authenticates to it with: the SAME value on both services. Unset on the orchestrator, no run is
      # granted either tool; unset on the agents service only, their calls are refused with a message naming the variable. A run gets
      # run_spec only when its app sets qa.closedLoop.enabled, and the browser only when it sets qa.agentBrowser.enabled.
      QA_TOOLS_PORT: ${QA_TOOLS_PORT:-459}
      QA_TOOLS_TOKEN: ${QA_TOOLS_TOKEN:-}
    volumes:
      - ./config:/app/config # app configs + the config/e2e seed (read-mostly; not hot-swapped)
      # NOTE: src/ and package files are NOT bind-mounted here on purpose — the hot-swap must be
      # able to rewrite them (a bind mount → EBUSY). They ship baked in the image. The dev
      # override re-adds them for live editing. The E2E suite is NOT in a volume: it lives in git.
      - mirrors:/app/.mirrors # local working copies (shared with the agents container); the harness runs over <repo>/e2e here
      - qa-data:/app/data # run history + maintainer state (markers/ledger/failure memory) — persists across restarts
      # The code graph indexed at onboarding (onboarding-auto-index). Regenerable cache — losing it
      # only degrades the advisory structural signal until a re-index — but persisting it avoids
      # silently starting every boot blind. Orchestrator-only: agents/ has no codebase-memory CLI.
      - codebase-memory:/app/.codebase-memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-458}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  agents:
    build: ./agents # dual agent runtime: OpenCode + Codex + uv/JDK (Serena) + engram
    restart: always
    # Same explicit resolvers as the orchestrator: the agent must reach the model gateway and
    # the live DEV site (Playwright MCP) regardless of host/VPN DNS quirks.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # SECURITY: the agent container does NOT get the full .env. It receives ONLY the
    # model-provider keys, the shared OpenCode server password, the run_spec service token and DEV_ENV_* (the HTTP Basic gate
    # of DEV, read by the baseline arm's Playwright config and a Codex shell) — NEVER the test
    # account (DEV_TEST_*: the app login is the orchestrator's and the agent only gets the saved
    # session) nor GITHUB_TOKEN / WEBHOOK_SECRET / QA_API_TOKEN. Git writes are the orchestrator's
    # job, so the agent has no push credential to exfiltrate. (docker compose reads
    # ./.env for ${VAR} interpolation, so this works locally and under Doppler.)
    environment:
      MIRROR_DIR: /app/.mirrors
      ENGRAM_DATA_DIR: /data
      AGENT_PROMPT_DIR: /root/.config/agent
      AGENT_SUPERVISOR_PORT: 4097
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-single}
      AGENT_SINGLE_PROVIDER: ${AGENT_SINGLE_PROVIDER:-}
      AGENT_PRIMARY_PROVIDER: ${AGENT_PRIMARY_PROVIDER:-}
      AGENT_REVIEWER_PROVIDER: ${AGENT_REVIEWER_PROVIDER:-}
      AGENT_CHAT_PROVIDER: ${AGENT_CHAT_PROVIDER:-}
      AGENT_PRIMARY_MODEL: ${AGENT_PRIMARY_MODEL:-}
      AGENT_REVIEWER_MODEL: ${AGENT_REVIEWER_MODEL:-}
      AGENT_CHAT_MODEL: ${AGENT_CHAT_MODEL:-}
      OPENCODE_PRINT_LOGS: "true"
      OPENCODE_LOG_LEVEL: ${OPENCODE_LOG_LEVEL:-INFO}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      # Required by `opencode serve` (port 4096 is open to every container on the network); see the orchestrator entry.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      # run_spec and authbrowser_* tools (agents/tool/): where the orchestrator's internal endpoint is, and the service token it requires.
      QA_TOOLS_PORT: ${QA_TOOLS_PORT:-459}
      QA_TOOLS_TOKEN: ${QA_TOOLS_TOKEN:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      DEV_ENV_USER: ${DEV_ENV_USER:-}
      DEV_ENV_PASS: ${DEV_ENV_PASS:-}
      # `opencode serve` ignores a watched repo's own opencode.json/.opencode (they could re-grant a shell or run a
      # plugin). Only the baseline experiment needs them: set exactly "true" for that run, never in production.
      AGENT_ALLOW_PROJECT_CONFIG: ${AGENT_ALLOW_PROJECT_CONFIG:-}
    volumes:
      - ./agents:/root/.config/opencode:ro # opencode.json + agents + AGENTS.md + skills (read-only: agents must NOT rewrite their own prompts)
      - ./agent:/root/.config/agent:ro # provider-neutral prompts/skills for Codex and future OpenCode config
      - mirrors:/app/.mirrors # SAME path as the orchestrator: the agent reads/writes here (Serena caches in <repo>/.serena)
      - serena-cache:/root/.cache/uv # uv/Serena cache (avoids re-downloading on each boot)
      - engram-data:/data # engram's episodic-memory SQLite — persists across restarts
      - opencode-data:/root/.local/share/opencode # sessions + auth — survives restarts
      - codex-data:/root/.codex # Codex auth/session state — survives restarts
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4097/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "4.0"

volumes:
  mirrors:
  qa-data:
  codebase-memory: # graph store indexed at onboarding (regenerable; persisted to avoid blind boots)
  serena-cache:
  engram-data:
  opencode-data:
  codex-data:
