# Package registries the execution sandbox's INSTALL children may reach (the e2e project's `npm ci`). This
# is data, not code: a registry added here is reachable by every app's install step, nothing else is. An app
# adds a private registry or a mirror of its own with `egress.installOrigins` in its config, and the origins
# its specs may reach with `dev.allowedOrigins`.
#
# An origin is scheme://host[:port], or scheme://*.suffix[:port] for every subdomain of a suffix (at least two
# labels). Hosts only, never IP literals over https. Only the `npm` group is read: the e2e project installs
# with `npm`.
npm:
  - https://registry.npmjs.org
