# Watched-app template. COPY to config/apps/<your-app>.yaml and fill it in.
# ${VARS} are expanded from the environment (.env) — do not put secrets here.

name: "example"
repo: "org/example"            # owner/repo on GitHub (Issues + E2E suite PRs)
baseBranch: "main"             # target branch for the QA pull requests

# Optional: where this repo keeps its OpenAPI/Swagger contract(s) — a glob or a list
# of globs relative to the repo root. The QA AGENT locates and reads them as authoring
# context (to write contract-aware assertions: required fields, enums, error responses);
# the orchestrator never parses them, and the agent never calls the API directly (it
# drives the app through the web UI). Omit for repos with no backend contract (e.g. a
# static frontend). Example for an Angular + Spring monorepo:
# openapi:
#   - "**/src/main/resources/openapi/*.yaml"
#   - "**/api-definition.yaml"

# code mode: set `code: true` to test source-code logic directly (run the repo's
# own test suite, classified by exit code) WITHOUT a web environment or Playwright.
# In code mode the whole `dev:` block below is omitted (there is no DEV URL).
# code: true

# Optional (e2e apps only): the microservice repos that participate in this app's
# flows. A webhook from one of these repos — sent by ITS CI/CD AFTER deploying to
# DEV (deploy-event semantics) — triggers an e2e run of THIS app with the service
# commit's diff as blast radius. versionUrl is an optional verification belt: when
# present, the gate polls it for the service SHA before testing. The agent reads
# the service's read-only working copy plus its OpenAPI to derive frontend impact
# (it never calls the service directly — flows are always driven through the UI).
# services:
#   - repo: "org/orders-svc"
#     openapi: "**/openapi/*.yaml"           # glob INSIDE the service repo
#     versionUrl: "https://dev-api.example.internal/orders/version"
#   - repo: "org/payments-svc"

# Optional (e2e apps only): the qa-engine cross-repo boundary conventions — how THIS repo's
# frontend calls its backends, and where each backend's OpenAPI contract lives. Complements
# `services:` above (which lists the participating repos); `boundaries:` declares the CALL
# CONVENTION between them so the qa-engine resolver can stitch frontend call-sites to backend
# operationIds with zero app-specific literal in the engine itself. Consumed only by the
# qa-engine resolver (service-topology context) — the app config loader (src/orchestrator) strips
# unknown keys and ignores this block entirely.
# boundaries:
#   - transport: http
#     frontFiles: "**/*.api.ts"                       # filename-suffix glob of front egress files
#     frontCallSite: { kind: receiver-verb-call, receiver: "this.rest" }
#     servicePrefixTemplate: "name-{service}-api"      # required {service} token; e.g. name-orders-api/orders
#     serviceRepoTemplate: "ms-name-{service}"         # e.g. ms-name-orders
#     openApiPath: "src/main/resources/openapi/api-definition.yaml"
#   # EVENT transport: for repos whose backends talk to each other ONLY via events (NATS,
#   # RabbitMQ, or any broker sharing the same class-based publish/listen convention below —
#   # the transport itself is opaque, only the class/method SHAPE matters). Scans every repo in
#   # `services:` (plus the primary repo) for listener/publisher classes matching this shape and
#   # joins them by event name (exact) or domain/model name-stem (fallback).
#   - transport: event
#     files: "**/*.java"                               # glob of backend source files to scan
#     eventPattern:
#       kind: class-based-domain-events                 # catalog key — the in-core SHAPE to match
#       listenerBaseType: "ListenerMessageDelegate"      # base class/interface a listener extends/implements
#       listenerEventCall: "convertMsgToSpecificType"    # method that reads the consumed event, e.g. call(msg, FooEvent.class)
#       subscriberBaseType: "DomainEventSubscriber"      # generic interface a broker interface extends, e.g. extends DomainEventSubscriber<FooModel>
#       publishCall: "publishGenericMessage"             # method that publishes with a `.class` argument, e.g. call(subject, event, FooEvent.class)
#   # HTTP-BACKEND transport: BE→BE REST clients (RestTemplate / Feign / WebClient). Scans
#   # backend repos (services[] plus the primary repo) for outbound HTTP calls and joins them
#   # to each target service's OpenAPI operationId. FE→BE HTTP stays `transport: http`.
#   - transport: http-backend
#     sourceFiles: "**/*.java"                          # filename-suffix glob of backend client files
#     callPattern: { kind: rest-template-exchange, receiver: "restTemplate" }
#     servicePrefixTemplate: "name-{service}-api"      # required {service} token; e.g. name-orders-api/orders. Bare /api/... needs a prefix template that still contains {service}.
#     serviceRepoTemplate: "ms-name-{service}"
#     openApiPath: "src/main/resources/openapi/api-definition.yaml"

# App login. Omit the block for a public app. HTTP Basic of the whole DEV
# environment is NOT this block — that is DEV_ENV_USER/PASS from onboarding
# ("basic auth"). Values live in the env store; these fields are names only.
#   form: usernameEnv + passwordEnv (a Playwright setup project saves storageState)
#   mtls: certEnv (base64 PKCS#12) + certPassEnv
# auth:
#   kind: form
#   usernameEnv: QA_EXAMPLE_TEST_USER
#   passwordEnv: QA_EXAMPLE_TEST_PASS
#   # Optional, form only: where the login page lives when following the app's own links does
#   # not reach it. A path on the app's own origin (e.g. /signin), never a URL or //host.
#   loginPath: /signin

# `dev` is REQUIRED for e2e apps (the default) and OMITTED for code-mode apps.
dev:
  baseUrl: "https://dev.example.internal"
  # versionUrl is OPTIONAL: a `/version` endpoint returning { sha, healthy }. The
  # pipeline waits for it (deploy gate) and uses it for health checks. OMIT it for
  # already-deployed sites with no such endpoint (e.g. a static site) → gate skipped.
  versionUrl: "https://dev.example.internal/version"
  pollIntervalMs: 10000        # how often the gate polls
  deployTimeoutMs: 600000      # 10 min for DEV to stabilize on the new SHA
  # geolocation:                # optional: the browser position the suite, the Context Pack and the authoring browser use
  #   latitude: 40.4818         # Alcalá de Henares' historic centre, for example
  #   longitude: -3.3643
  #   places:                   # optional: names the agent may pick with set_geolocation, and a plan may name per flow
  #     barcelona: { latitude: 41.3874, longitude: 2.1686 }
  #     empty: { latitude: 0, longitude: 0 }
  # dataState:                  # optional: capture-time data-state readiness — tells the Context Pack when a page's data has
  #   routes:                   # settled so an empty tree is not read as truth. Selectors are app data, never engine facts.
  #     "/restaurants":         # a route path; a key with parameters names the pages that fill it segment by segment
  #                             # ("/restaurants/:province/:city"), a key ending "/*" a prefix and its root ("/restaurants/*");
  #                             # an exact key wins, then a key with parameters, then a prefix
  #       readySelector: "[data-testid='restaurant-list']"   # must appear for the page to be ready
  #       resultSelector: "[data-testid='restaurant-card']"  # count results (0 is unconfirmed → captured once more)
  #       # resultTextSelector: "[data-testid='result-count']"  # alternative: first integer in the text is the count
  #       locationSelector: "[data-testid='location-label']"    # the effective location the page shows
  #       timeoutMs: 8000       # how long to wait for readiness/result before deeming the state unconfirmed (1..15000)
  # routeSamples:               # optional: a real page per route template of the context map, opened by the Context Pack
  #                             # when no link the site shows fits the template (an app that navigates by script). Each
  #                             # page must fill its template segment by segment; at most 32. A declared page that shows
  #                             # what a page that cannot exist shows (deleted from DEV) is reported, not delivered.
  #   "/restaurants/:province/:city/:slug": "/restaurants/madrid/madrid/casa-pepe"

# e2e:
#   # The app's test-id convention. Drives Playwright getByTestId, the DOM capture
#   # test-id hints, and the selector catalog. Defaults to "data-testid".
#   # jhipster-style apps typically use "data-cy".
#   testIdAttribute: "data-cy"

qa:
  needsReview: true            # the strict reviewer validates the generated E2E tests
  shadow: false                # true = run everything but do NOT publish PRs or open Issues (initial rollout)
  # Review-loop integrity master switch: failure triage (a target absent from DEV is not a test
  # defect), the intent lock and the findings filter. On by default; the acceptance correctness
  # fixes are always on. Off restores the pre-switch flow and forces the intent lock off.
  # reviewLoopIntegrity: false
  testDataPrefix: "qa-bot"     # test entities namespaced per SHA
  # Change-coverage (the value keystone): does the suite actually exercise the lines the commit
  # changed? Optional; defaults to mode "signal", minRatio 0.7.
  changeCoverage:
    mode: signal               # off | signal (measure+record only) | enforce (close the gap, block if still low)
    minRatio: 0.7              # fraction of changed lines that must be exercised to "pass"
  # Test-intent lock: what a delivered test is FOR, derived by the orchestrator from the change
  # itself (string literals on added diff lines). A regeneration that drops an assertion, weakens a
  # matcher, flips a negation, replaces scope with a positional step, loses the anchor or changes an
  # in-scope expected value is rejected (enforce) or recorded (signal). Opacity is telemetry only.
  # intentLock:
  #   mode: signal             # off | signal (record would-be rejections) | enforce (reject, restore bytes)
  #   opacityFlagRatio: 0.5    # flag a contract whose unreadable clauses cross this ratio; never blocks
  # Value oracle — the ground-truth that lets the learning flywheel PROMOTE rules (not just
  # accumulate them). code apps: mutation testing via Stryker (bundled in the orchestrator — no
  # repo setup needed; JS/TS only). e2e apps: response fault-injection, which RE-RUNS the suite
  # against DEV once per green diff (≈2× execution — that is the cost of ground-truth).
  # Default is shadow-aware: OFF while `shadow: true` (don't double-run DEV during onboarding),
  # ON once you go to production (`shadow: false`). Set explicitly to override — e.g. a static
  # site with no backend should set "off" (fault-injection has nothing meaningful to corrupt).
  # valueOracle: signal        # off | signal  (omit to use the shadow-aware default)

report:
  onFailure: "github-issue"
