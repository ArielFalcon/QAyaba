# Grafana dashboard provider for the local telemetry stack (docs/telemetry-local.md). The LGTM image reads its
# provisioning tree from /otel-lgtm/grafana/conf/provisioning; docker-compose.telemetry.yml mounts this file under
# dashboards/ and the JSON it points at under /otel-lgtm/qayaba-dashboards.
apiVersion: 1

providers:
  - name: qayaba-evaluations
    orgId: 1
    folder: QAYABA
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /otel-lgtm/qayaba-dashboards
      foldersFromFilesStructure: false
