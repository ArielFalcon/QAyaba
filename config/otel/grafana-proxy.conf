# Loopback reverse proxy in front of Grafana (docker-compose.telemetry.yml, service grafana-proxy).
# Grafana's own container stays on the internal network only; this is the one process that is also on telemetry-ui,
# the network that carries the loopback-published port. It forwards to Grafana and nothing else.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  server_name _;

  location / {
    proxy_pass http://lgtm:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Grafana Live uses WebSockets.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }
}
