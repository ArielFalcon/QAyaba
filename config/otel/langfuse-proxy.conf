# Loopback reverse proxy in front of the Langfuse UI (docker-compose.langfuse.yml, service langfuse-proxy).
# langfuse-web itself is on internal networks only; this is the one process that is also on langfuse-ui, the network that
# carries the loopback-published port (127.0.0.1:3002). It forwards to langfuse-web and nothing else.

server {
  listen 8080;
  server_name _;
  # Dataset and trace exports can be large.
  client_max_body_size 20m;

  location / {
    proxy_pass http://langfuse-web:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
  }
}
