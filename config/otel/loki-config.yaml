# Loki for the local telemetry stack (docs/telemetry-local.md). A copy of grafana/otel-lgtm 0.37.0's own
# /otel-lgtm/loki-config.yaml, because that image sets no retention and Loki's retention is YAML-only. Re-check this copy
# when the image pin moves; `npm test` pins the retention window and the line cap below.
#
# Retention is the campaign window (R4, default 180 days): a log cannot be tagged with the campaign it belongs to, so the
# only window that cannot cut a campaign's logs early is the longest one. Ordinary spans keep their own 30-day window.
limits_config:
  retention_period: 4320h
  # Hostile or accidental input is capped before it reaches the store. A longer line is truncated, never rejected.
  max_line_size: 64kb
  max_line_size_truncate: true

compactor:
  working_directory: /data/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false
